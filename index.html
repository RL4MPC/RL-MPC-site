  </main><script>
    document.querySelectorAll('.scene').forEach(section => {
      const videos = [...section.querySelectorAll('video')];
      const status = section.querySelector('.playback-status');
      let request = 0;
      const pause = () => videos.forEach(video => video.pause());
      function ready(video) {
        if (video.readyState >= 3) return Promise.resolve();
        return new Promise((resolve,reject) => {
          const clean = () => { clearTimeout(timer); video.removeEventListener('canplay',loaded); video.removeEventListener('error',failed); };
          const loaded = () => { clean(); resolve(); };
          const failed = () => { clean(); reject(new Error('Video unavailable')); };
          const timer = setTimeout(failed,30000);
          video.addEventListener('canplay',loaded,{once:true}); video.addEventListener('error',failed,{once:true});
          video.preload = 'auto'; video.load();
        });
      }
      async function play(fromStart = false) {
        const token = ++request;
        const start = fromStart || videos.every(video => video.ended) ? 0 : Math.min(...videos.map(video => video.currentTime));
        pause(); status.textContent = '正在加载本场景视频…';
        try {
          await Promise.all(videos.map(ready));
          if (token !== request) return;
          videos.forEach(video => { video.currentTime = Math.min(start,Number.isFinite(video.duration) ? video.duration : start); });
          await Promise.all(videos.filter(video => !Number.isFinite(video.duration) || video.currentTime < video.duration).map(video => video.play()));
          if (token === request) status.textContent = '';
        } catch {
          if (token !== request) return;
          pause(); status.textContent = '暂时无法同时播放，请使用各视频的播放按钮。';
        }
      }
      section.querySelector('[data-action="play"]').addEventListener('click',() => play());
      section.querySelector('[data-action="restart"]').addEventListener('click',() => play(true));
      section.querySelector('[data-action="pause"]').addEventListener('click',() => { ++request; pause(); status.textContent = ''; });
    });
</script></body></html>
